<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6F0; --panel:#FFFFFF; --ink:#14232B; --muted:#5C6E77; --line:#DFE5DD;
  --mint:#159A6A; --mint-soft:#D8F1E5; --blue:#2F55F0; --blue-soft:#DDE5FF;
  --theirs:#FFFFFF; --danger:#D03A2A; --overlay:rgba(10,20,26,.45); --onaccent:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E171C; --panel:#16232A; --ink:#E8EFEA; --muted:#93A4AC; --line:#243741;
    --mint:#2CC48C; --mint-soft:#14513B; --blue:#7C93FF; --blue-soft:#233A8A;
    --theirs:#1C2D35; --danger:#FF7B6B; --overlay:rgba(0,0,0,.6); --onaccent:#0E171C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171C; --panel:#16232A; --ink:#E8EFEA; --muted:#93A4AC; --line:#243741;
  --mint:#2CC48C; --mint-soft:#14513B; --blue:#7C93FF; --blue-soft:#233A8A;
  --theirs:#1C2D35; --danger:#FF7B6B; --overlay:rgba(0,0,0,.6); --onaccent:#0E171C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}

/* Connexion */
#splash,#auth{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow-y:auto}
#splash{place-items:center}
#splash.show{display:grid}
#auth.show{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px 22px}
.card .logo{display:flex;justify-content:center;margin-bottom:6px}
.card h1{margin:0;text-align:center;font-size:32px;letter-spacing:-.02em}
.card .sub{margin:4px 0 18px;text-align:center;color:var(--muted);font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{padding:9px;border-radius:11px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.err{min-height:20px;margin:0 0 10px;color:var(--danger);font-size:14px;text-align:center}
.linkbtn{display:block;margin:14px auto 0;color:var(--blue);font-size:14px}

.app{height:100%;display:grid;grid-template-columns:1fr;overflow:hidden}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.app[data-view="list"] .chat-pane{display:none}
.app[data-view="chat"] .list-pane{display:none}
@media (min-width:820px){
  .app{grid-template-columns:360px 1fr}
  .app[data-view] .chat-pane,.app[data-view] .list-pane{display:flex}
  .list-pane{border-right:1px solid var(--line)}
  .back{display:none!important}
}

.top{display:flex;align-items:center;gap:6px;padding:14px 12px 6px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:26px;letter-spacing:-.02em;flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--line)}
.icon-btn.solid{background:var(--ink);color:var(--bg)}
.icon-btn.solid:hover{background:var(--ink);opacity:.88}
.search{margin:6px 16px 8px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;min-width:0;outline:none}
.chips{display:flex;gap:8px;padding:2px 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{flex:1;overflow-y:auto;padding:0 8px 16px}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:14px}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.item .mid{min-width:0}
.item .row1{display:flex;align-items:center;gap:6px}
.item .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500}
.tag.mint{background:var(--mint-soft);color:var(--mint)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.item .prev{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--muted)}
.badge{width:12px;height:12px;border-radius:50%;background:var(--mint)}
.empty-list{padding:40px 24px;text-align:center;color:var(--muted)}

.avatar{width:48px;height:48px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;flex:none}
.avatar.round{border-radius:50%}
.avatar.square{border-radius:14px}
.avatar.small{width:40px;height:40px;font-size:16px}

.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.chat-head .titles{flex:1;min-width:0;text-align:left}
.chat-head .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:6px 0}
.bubble{max-width:80%;padding:8px 12px 6px;border-radius:16px;background:var(--theirs);border:1px solid var(--line);text-align:left;word-wrap:break-word;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--mint-soft);border-color:transparent;border-bottom-right-radius:5px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:5px}
.chat-pane[data-kind="canal"] .bubble.me{background:var(--blue-soft)}
.chat-pane[data-kind="canal"] .bubble.them{max-width:92%}
.bubble .who{font-size:13px;font-weight:700;margin-bottom:2px}
.bubble .txt{white-space:pre-wrap}
.bubble img.pic{display:block;max-width:100%;border-radius:10px;margin:2px 0 4px}
.bubble audio{display:block;max-width:100%;height:40px;margin:2px 0 4px}
.quote{border-left:3px solid var(--blue);padding:2px 8px;margin-bottom:5px;font-size:13px;color:var(--muted);background:rgba(127,127,127,.1);border-radius:4px}
.quote b{display:block;color:var(--blue);font-weight:700}
.meta{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}
.react{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 6px}

.composer{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 6px 8px}
.bar .bq{flex:1;border-left:3px solid var(--blue);padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bq b{color:var(--blue)}
.row{display:flex;align-items:flex-end;gap:6px}
.row textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;line-height:1.3;max-height:120px;min-height:42px;outline:none}
.act{width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--onaccent);display:grid;place-items:center;flex:none}
.chat-pane[data-kind="canal"] .act{background:var(--blue)}
.act[hidden]{display:none}
.readonly{text-align:center;color:var(--muted);font-size:14px;padding:10px}
.recbar{display:flex;align-items:center;gap:10px;padding:0 6px}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.rectime{font-weight:500;flex:1}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recdot{animation:none}}

.placeholder{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;color:var(--muted);padding:24px}
.placeholder h2{margin:0;color:var(--ink);font-size:22px}
.placeholder p{margin:0;max-width:34ch}

.overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
@media (min-width:820px){.overlay{align-items:center}}
.sheet{width:100%;max-width:440px;background:var(--panel);border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
@media (min-width:820px){.sheet{border-radius:22px}}
.sheet h3{margin:4px 6px 10px;font-size:18px}
.sheet .hint{margin:0 6px 12px;color:var(--muted);font-size:14px}
.emojis{display:flex;justify-content:space-around;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.emojis button{font-size:26px;width:46px;height:46px;border-radius:50%}
.emojis button:hover,.emojis button[aria-pressed="true"]{background:var(--line)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-radius:12px;text-align:left}
.opt:hover{background:var(--bg)}
.opt.danger{color:var(--danger)}
.field{display:block;margin:0 6px 12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.card input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.card .field{margin:0 0 12px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 6px 14px}
.types button{border:1px solid var(--line);border-radius:14px;padding:10px 6px;font-size:14px;text-align:center;background:var(--bg)}
.types button small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.types button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.primary{width:calc(100% - 12px);margin:0 6px;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px;font-weight:700}
.card .primary{width:100%;margin:0}
.primary[disabled]{opacity:.55}
.chrow{display:flex;align-items:center;gap:12px;padding:8px 6px}
.chrow .nm{flex:1;min-width:0}
.chrow .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow .nm small{color:var(--muted)}
.mini{padding:7px 14px;border-radius:999px;background:var(--blue);color:var(--onaccent);font-size:14px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:88%;text-align:center;display:none}
.toast.show{display:block}
</style>
</head>
<body>

<div id="splash" class="show" aria-label="Chargement"><div id="splashLogo"></div></div>

<div id="auth">
  <div class="card">
    <div class="logo" id="authLogo"></div>
    <h1>MLD</h1>
    <p class="sub">Discussions, groupes et canaux au même endroit.</p>
    <div class="tabs" role="group" aria-label="Mode">
      <button id="tabIn" aria-pressed="true">Connexion</button>
      <button id="tabUp" aria-pressed="false">Inscription</button>
    </div>
    <label class="field" id="nameField" style="display:none"><span>Pseudo</span><input id="aName" type="text" maxlength="30" autocomplete="nickname" placeholder="Ton prénom ou pseudo"></label>
    <label class="field"><span>Adresse e-mail</span><input id="aMail" type="email" autocomplete="email" inputmode="email" placeholder="toi@exemple.com"></label>
    <label class="field"><span>Mot de passe</span><input id="aPass" type="password" autocomplete="current-password" placeholder="6 caractères minimum"></label>
    <p class="err" id="aErr" role="alert"></p>
    <button class="primary" id="aGo">Se connecter</button>
    <button class="linkbtn" id="aReset">Mot de passe oublié ?</button>
  </div>
</div>

<div class="app" id="app" data-view="list" style="display:none">
  <section class="pane list-pane" aria-label="Conversations">
    <div class="top">
      <div class="brand" id="brand"></div>
      <button class="icon-btn solid" id="btnNew" aria-label="Nouvelle conversation"></button>
      <button class="icon-btn" id="btnMe" aria-label="Mon compte"></button>
    </div>
    <label class="search"><span id="icoSearch"></span><input id="search" type="search" placeholder="Rechercher" aria-label="Rechercher une conversation"></label>
    <div class="chips" id="chips" role="group" aria-label="Filtres"></div>
    <div class="list" id="list"></div>
  </section>

  <section class="pane chat-pane" id="chatPane" aria-label="Conversation">
    <div class="placeholder" id="placeholder">
      <div id="bigLogo"></div>
      <h2>Tout au même endroit</h2>
      <p>Tes discussions, tes groupes et tes canaux réunis dans une seule application.</p>
    </div>
    <div id="chatBody" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="chat-head" id="head"></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="composer" id="composer"></div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" hidden>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,onSnapshot,query,where,orderBy,limit,limitToLast,arrayUnion,arrayRemove,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCedmoez5kS3weAR5C6nlQHg9LXW_Qb8G8",
  authDomain:"mld-chat-2dabe.firebaseapp.com",
  projectId:"mld-chat-2dabe",
  storageBucket:"mld-chat-2dabe.firebasestorage.app",
  messagingSenderId:"859274701114",
  appId:"1:859274701114:web:91db36fc18eda1dc3c4803"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);

const AVC=["#159A6A","#2F55F0","#D9502E","#8E5BD9","#C98A12","#0E8FA0"];
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmtTime=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function dayLabel(t){
  const d=new Date(t),n=new Date();
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const b=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const diff=Math.round((b-a)/864e5);
  if(diff===0)return "Aujourd’hui";
  if(diff===1)return "Hier";
  return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
}
function hashColor(s){let x=0;for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x%AVC.length;}
function lsGet(k,d){try{const r=localStorage.getItem(k);return r?JSON.parse(r):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

const ICONS={
  back:'<path d="M15 5l-7 7 7 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',
  send:'<path d="M4 12l16-8-6 17-3-7z"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/>',
  clip:'<path d="M20 11l-8 8a5 5 0 01-7-7l8.5-8.5a3.3 3.3 0 014.7 4.7L9.5 16.5a1.7 1.7 0 01-2.4-2.4L14 7"/>',
  more:'<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>',
  star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  reply:'<path d="M10 7L4 12l6 5M4 12h9a7 7 0 017 7"/>',
  edit:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>',
  trash:'<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>',
  copy:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>',
  out:'<path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 8l-4 4 4 4M6 12h10"/>'
};
function ico(n,size,fill){
  return '<svg width="'+(size||22)+'" height="'+(size||22)+'" viewBox="0 0 24 24" fill="'+(fill?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';
}
function logo(size){
  return '<svg width="'+(size*1.5)+'" height="'+size+'" viewBox="0 0 36 24" aria-hidden="true"><defs><clipPath id="c'+size+'"><circle cx="13" cy="12" r="10"/></clipPath></defs><circle cx="13" cy="12" r="10" fill="var(--mint)"/><circle cx="23" cy="12" r="10" fill="var(--blue)"/><circle cx="23" cy="12" r="10" fill="var(--panel)" clip-path="url(#c'+size+')"/></svg>';
}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  attrs=attrs||{};
  for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="html")e.innerHTML=attrs[k];
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});
  return e;
}
let toastT=null;
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),3200);
}
function errText(e){
  const c=(e&&e.code)||"";
  const map={
    "auth/invalid-email":"Adresse e-mail invalide.",
    "auth/email-already-in-use":"Cette adresse a déjà un compte. Va dans Connexion.",
    "auth/weak-password":"Mot de passe trop court (6 caractères minimum).",
    "auth/invalid-credential":"E-mail ou mot de passe incorrect.",
    "auth/user-not-found":"E-mail ou mot de passe incorrect.",
    "auth/wrong-password":"E-mail ou mot de passe incorrect.",
    "auth/missing-password":"Écris ton mot de passe.",
    "auth/network-request-failed":"Pas de connexion internet.",
    "auth/operation-not-allowed":"La connexion par e-mail n’est pas encore activée dans Firebase.",
    "auth/too-many-requests":"Trop d’essais. Réessaie dans quelques minutes.",
    "permission-denied":"Accès refusé. Vérifie les règles de sécurité dans Firebase.",
    "unavailable":"Pas de connexion. Réessaie."
  };
  return map[c]||map[c.replace("firestore/","")]||"Une erreur est survenue ("+(c||"inconnue")+").";
}

/* ---------- État ---------- */
let me=null,pendingName=null;
let chats=[],msgs=[],active=null,shownFor=null;
let unsubChats=null,unsubMsgs=null;
let view="list",filter="tout",queryText="",replyTo=null,editing=null,rec=null,firstLoad=false;
let favs=lsGet("mld-fav",[]),reads=lsGet("mld-read",{}),hidden=lsGet("mld-hidden",[]);

const activeChat=()=>chats.find(c=>c.id===active)||null;
function markRead(id){reads[id]=Date.now();lsSet("mld-read",reads);}
function cname(c){
  if(c.type==="saved")return "Messages enregistrés";
  if(c.type==="perso"){
    const o=(c.members||[]).find(u=>u!==me.uid);
    return (c.names&&c.names[o])||"Contact";
  }
  return c.name||"Sans nom";
}
function tagFor(c){
  return ({perso:["Discussion","mint"],groupe:["Groupe","mint"],canal:["Canal","blue"]})[c.type]||null;
}
function subtitle(c){
  if(c.type==="perso")return "Discussion privée";
  if(c.type==="groupe"){
    const n=c.names||{};
    return (c.members||[]).map(u=>u===me.uid?"Toi":(n[u]||"Membre")).join(", ");
  }
  if(c.type==="canal"){const k=(c.members||[]).length;return k+" abonné"+(k>1?"s":"");}
  return "Visible par toi seul";
}
function preview(m){
  if(m.audio)return "🎤 Message vocal";
  if(m.img&&!m.text)return "📷 Photo";
  return m.text||"";
}
function avatar(c,small){
  const sq=c.type==="canal";
  const el=h("div",{class:"avatar "+(sq?"square":"round")+(small?" small":"")});
  el.style.background=AVC[hashColor(cname(c))];
  if(c.type==="saved")el.innerHTML=ico("star",small?20:22,true);
  else el.textContent=cname(c).charAt(0).toUpperCase();
  return el;
}
function isUnread(c){
  return !!c.lastAt&&c.lastFrom!==me.uid&&c.lastAt>(reads[c.id]||0)&&!(active===c.id&&view==="chat");
}

/* ---------- Connexion ---------- */
let mode="in";
function setMode(m){
  mode=m;
  $("#tabIn").setAttribute("aria-pressed",String(m==="in"));
  $("#tabUp").setAttribute("aria-pressed",String(m==="up"));
  $("#nameField").style.display=m==="up"?"block":"none";
  $("#aGo").textContent=m==="up"?"Créer mon compte":"Se connecter";
  $("#aPass").setAttribute("autocomplete",m==="up"?"new-password":"current-password");
  $("#aErr").textContent="";
}
$("#tabIn").addEventListener("click",()=>setMode("in"));
$("#tabUp").addEventListener("click",()=>setMode("up"));
async function submitAuth(){
  const mail=$("#aMail").value.trim(),pass=$("#aPass").value,nm=$("#aName").value.trim();
  const err=$("#aErr");err.textContent="";
  if(!mail||!pass){err.textContent="Remplis l’e-mail et le mot de passe.";return;}
  if(mode==="up"&&!nm){err.textContent="Choisis un pseudo.";return;}
  const btn=$("#aGo");btn.disabled=true;
  try{
    if(mode==="up"){
      pendingName=nm;
      const cred=await createUserWithEmailAndPassword(auth,mail,pass);
      await updateProfile(cred.user,{displayName:nm});
    }else{
      await signInWithEmailAndPassword(auth,mail,pass);
    }
  }catch(e){pendingName=null;err.textContent=errText(e);}
  btn.disabled=false;
}
$("#aGo").addEventListener("click",submitAuth);
$("#aPass").addEventListener("keydown",e=>{if(e.key==="Enter")submitAuth();});
$("#aReset").addEventListener("click",async()=>{
  const mail=$("#aMail").value.trim(),err=$("#aErr");
  if(!mail){err.textContent="Écris ton e-mail ci-dessus, puis touche « Mot de passe oublié ».";return;}
  try{await sendPasswordResetEmail(auth,mail);err.style.color="var(--mint)";err.textContent="E-mail envoyé. Regarde aussi tes courriers indésirables.";}
  catch(e){err.style.color="var(--danger)";err.textContent=errText(e);}
});

onAuthStateChanged(auth,async user=>{
  $("#splash").classList.remove("show");
  if(!user){
    me=null;
    if(unsubChats){unsubChats();unsubChats=null;}
    if(unsubMsgs){unsubMsgs();unsubMsgs=null;}
    chats=[];msgs=[];active=null;shownFor=null;
    $("#app").style.display="none";
    $("#auth").classList.add("show");
    $("#aErr").style.color="var(--danger)";
    return;
  }
  const name=pendingName||user.displayName||(user.email||"Moi").split("@")[0];
  pendingName=null;
  me={uid:user.uid,name:name,email:user.email||""};
  $("#auth").classList.remove("show");
  $("#app").style.display="grid";
  try{
    await setDoc(doc(db,"users",me.uid),{name:me.name,email:me.email,emailLower:me.email.toLowerCase(),createdAt:Date.now()},{merge:true});
    await setDoc(doc(db,"chats","saved_"+me.uid),{type:"saved",name:"Messages enregistrés",owner:me.uid,members:[me.uid]},{merge:true});
  }catch(e){toast(errText(e));}
  startChats();
});

function startChats(){
  if(unsubChats)unsubChats();
  unsubChats=onSnapshot(query(collection(db,"chats"),where("members","array-contains",me.uid)),snap=>{
    chats=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(active&&view==="chat")markRead(active);
    renderList();
    const c=activeChat();
    if(active&&!c){active=null;shownFor=null;setView("list");renderChatAll();}
    else if(c){
      if(shownFor!==active){shownFor=active;renderChatAll();}
      else renderHead();
    }
  },e=>toast(errText(e)));
}

/* ---------- Liste ---------- */
const FILTERS=[["tout","Tout"],["discussions","Discussions"],["canaux","Canaux"],["favoris","Favoris"]];
function renderChips(){
  const box=$("#chips");box.innerHTML="";
  FILTERS.forEach(f=>box.append(h("button",{class:"chip","aria-pressed":String(filter===f[0]),onclick:()=>{filter=f[0];renderChips();renderList();}},f[1])));
}
function matches(c){
  if(hidden.includes(c.id))return false;
  if(filter==="discussions"&&!(c.type==="perso"||c.type==="groupe"||c.type==="saved"))return false;
  if(filter==="canaux"&&c.type!=="canal")return false;
  if(filter==="favoris"&&!favs.includes(c.id))return false;
  if(queryText&&cname(c).toLowerCase().indexOf(queryText.toLowerCase())<0)return false;
  return true;
}
function renderList(){
  if(!me)return;
  const box=$("#list");box.innerHTML="";
  const arr=chats.filter(matches).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  if(!arr.length){box.append(h("div",{class:"empty-list"},"Aucune conversation ici. Touche + pour en commencer une."));return;}
  arr.forEach(c=>{
    const tag=tagFor(c);
    let pv=c.lastText||"Aucun message";
    if(c.lastFrom===me.uid&&c.type!=="saved")pv="Toi : "+pv;
    else if(c.type==="groupe"&&c.lastFromName)pv=c.lastFromName+" : "+pv;
    box.append(h("button",{class:"item","aria-current":String(active===c.id),onclick:()=>openChat(c.id)},
      avatar(c),
      h("div",{class:"mid"},
        h("div",{class:"row1"},h("span",{class:"name"},cname(c)),tag?h("span",{class:"tag "+tag[1]},tag[0]):null),
        h("div",{class:"prev"},pv)),
      h("div",{class:"side"},h("span",null,c.lastAt?fmtTime(c.lastAt):""),isUnread(c)?h("span",{class:"badge","aria-label":"Nouveau message"}):null)
    ));
  });
}

/* ---------- Conversation ---------- */
function setView(v){view=v;$("#app").dataset.view=v;}
function openChat(id){
  active=id;replyTo=null;editing=null;
  if(rec)cancelRec();
  markRead(id);setView("chat");
  if(unsubMsgs)unsubMsgs();
  msgs=[];firstLoad=true;
  unsubMsgs=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("t","asc"),limitToLast(200)),snap=>{
    msgs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(active===id){renderMsgs();if(view==="chat"){markRead(id);renderList();}}
  },e=>toast(errText(e)));
  shownFor=activeChat()?id:null;
  renderList();renderChatAll();
}
function renderChatAll(){
  const c=activeChat();
  $("#placeholder").style.display=c?"none":"grid";
  $("#chatBody").style.display=c?"flex":"none";
  if(!c)return;
  $("#chatPane").dataset.kind=c.type;
  renderHead();renderMsgs();renderComposer();
}
function renderHead(){
  const c=activeChat();if(!c)return;
  const fav=favs.includes(c.id);
  const head=$("#head");head.innerHTML="";
  head.append(
    h("button",{class:"icon-btn back","aria-label":"Retour",html:ico("back"),onclick:()=>setView("list")}),
    avatar(c,true),
    h("div",{class:"titles"},h("div",{class:"t1"},cname(c)),h("div",{class:"t2"},subtitle(c))),
    h("button",{class:"icon-btn","aria-label":fav?"Retirer des favoris":"Ajouter aux favoris",html:ico("star",22,fav),onclick:()=>{
      favs=fav?favs.filter(x=>x!==c.id):favs.concat([c.id]);lsSet("mld-fav",favs);renderHead();renderList();}}),
    h("button",{class:"icon-btn","aria-label":"Plus d’options",html:ico("more"),onclick:chatMenu})
  );
}
function renderMsgs(){
  const c=activeChat();if(!c)return;
  const box=$("#msgs");
  const stick=firstLoad||box.scrollHeight-box.scrollTop-box.clientHeight<90;
  box.innerHTML="";
  let lastDay="";
  msgs.forEach(m=>{
    const dl=dayLabel(m.t);
    if(dl!==lastDay){box.append(h("div",{class:"day"},dl));lastDay=dl;}
    const mine=m.from===me.uid;
    const b=h("button",{class:"bubble "+(mine?"me":"them"),"aria-label":"Options du message",onclick:()=>msgMenu(m)});
    if(c.type==="groupe"&&!mine){
      const w=h("div",{class:"who"},m.fromName||"Membre");
      w.style.color=AVC[hashColor(m.fromName||"")];
      b.append(w);
    }
    if(m.replyTo)b.append(h("div",{class:"quote"},h("b",null,m.replyTo.name),m.replyTo.text));
    if(m.img)b.append(h("img",{class:"pic",src:m.img,alt:"Photo envoyée"}));
    if(m.audio){const au=h("audio",{controls:"controls",src:m.audio});au.addEventListener("click",e=>e.stopPropagation());b.append(au);}
    if(m.text)b.append(h("div",{class:"txt"},m.text));
    const meta=h("div",{class:"meta"});
    const counts={};
    Object.values(m.reacts||{}).forEach(e=>{counts[e]=(counts[e]||0)+1;});
    Object.keys(counts).forEach(e=>meta.append(h("span",{class:"react"},e+(counts[e]>1?" "+counts[e]:""))));
    if(m.edited)meta.append(h("span",null,"modifié"));
    meta.append(h("span",null,fmtTime(m.t)));
    b.append(meta);
    box.append(b);
  });
  if(stick)box.scrollTop=box.scrollHeight;
  firstLoad=false;
}

/* ---------- Saisie ---------- */
function canPost(c){return c.type!=="canal"||c.owner===me.uid;}
function renderComposer(){
  const c=activeChat();if(!c)return;
  const box=$("#composer");box.innerHTML="";
  if(!canPost(c)){box.append(h("div",{class:"readonly"},"Seul l’administrateur publie dans ce canal."));return;}
  if(rec){
    box.append(h("div",{class:"recbar"},
      h("button",{class:"icon-btn","aria-label":"Annuler l’enregistrement",html:ico("x"),onclick:cancelRec}),
      h("span",{class:"recdot"}),
      h("span",{class:"rectime",id:"rectime"},"0:00"),
      h("button",{class:"act","aria-label":"Envoyer le message vocal",html:ico("send",20,true),onclick:()=>rec.mr.stop()})
    ));
    return;
  }
  if(replyTo||editing){
    const t=editing||replyTo;
    const who=t.from===me.uid?"toi":(t.fromName||"Membre");
    box.append(h("div",{class:"bar"},
      h("div",{class:"bq"},h("b",null,editing?"Modification : ":"Réponse à "+who+" : "),preview(t)),
      h("button",{class:"icon-btn","aria-label":"Annuler",html:ico("x",18),onclick:()=>{replyTo=null;editing=null;renderComposer();}})
    ));
  }
  const ta=h("textarea",{rows:"1",placeholder:"Écrire un message","aria-label":"Message"});
  if(editing)ta.value=editing.text||"";
  const send=h("button",{class:"act","aria-label":"Envoyer",html:ico("send",20,true)});
  const mic=h("button",{class:"act","aria-label":"Enregistrer un message vocal",html:ico("mic",20)});
  function sync(){
    const has=ta.value.trim().length>0;
    send.hidden=!has;mic.hidden=has||!!editing;
    ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,120)+"px";
  }
  ta.addEventListener("input",sync);
  ta.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey&&window.matchMedia("(pointer:fine)").matches){e.preventDefault();doSend();}
  });
  async function doSend(){
    const v=ta.value.trim();if(!v)return;
    if(editing){
      const m=editing;editing=null;
      try{await updateDoc(doc(db,"chats",c.id,"messages",m.id),{text:v,edited:true});}catch(e){toast(errText(e));}
      renderComposer();return;
    }
    ta.value="";sync();
    sendMsg({text:v});
  }
  send.addEventListener("click",doSend);
  mic.addEventListener("click",startRec);
  const attach=h("button",{class:"icon-btn","aria-label":"Joindre une photo",html:ico("clip"),onclick:()=>$("#file").click()});
  box.append(h("div",{class:"row"},editing?null:attach,ta,send,mic));
  sync();
  if(editing)ta.focus();
}
async function sendMsg(p){
  const c=activeChat();if(!c||!canPost(c))return;
  const m={from:me.uid,fromName:me.name,t:Date.now()};
  if(p.text)m.text=p.text;
  if(p.img)m.img=p.img;
  if(p.audio)m.audio=p.audio;
  if(replyTo){m.replyTo={name:replyTo.from===me.uid?"Toi":(replyTo.fromName||"Membre"),text:preview(replyTo).slice(0,120)};replyTo=null;renderComposer();}
  try{
    await addDoc(collection(db,"chats",c.id,"messages"),m);
    await updateDoc(doc(db,"chats",c.id),{lastText:preview(m).slice(0,120),lastAt:m.t,lastFrom:me.uid,lastFromName:me.name});
  }catch(e){toast(errText(e));}
}

/* ---------- Photos et vocaux ---------- */
function readImg(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,640/Math.max(im.width,im.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",.6));
      };
      im.onerror=rej;im.src=r.result;
    };
    r.onerror=rej;r.readAsDataURL(file);
  });
}
$("#file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  readImg(f).then(d=>{
    if(d.length>850000){toast("Photo trop lourde.");return;}
    sendMsg({img:d});
  }).catch(()=>toast("Impossible de lire cette image."));
});
function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("L’enregistrement vocal n’est pas disponible ici.");return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const mr=new MediaRecorder(stream),chunks=[],start=Date.now();
    rec={mr,stream,start,cancel:false,timer:null};
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=()=>{
      const r0=rec;clearInterval(r0.timer);
      stream.getTracks().forEach(t=>t.stop());
      rec=null;
      if(r0.cancel){renderComposer();return;}
      const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
      const fr=new FileReader();
      fr.onload=()=>{
        renderComposer();
        if(fr.result.length>850000){toast("Message vocal trop long (30 secondes maximum).");return;}
        sendMsg({audio:fr.result});
      };
      fr.readAsDataURL(blob);
    };
    rec.timer=setInterval(()=>{
      const s=Math.floor((Date.now()-rec.start)/1000);
      const el=$("#rectime");if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
      if(s>=30)rec.mr.stop();
    },250);
    mr.start();renderComposer();
  }).catch(()=>toast("Micro refusé ou indisponible. Autorise-le dans ton navigateur."));
}
function cancelRec(){if(rec){rec.cancel=true;try{rec.mr.stop();}catch(e){}}}

/* ---------- Menus ---------- */
const overlay=$("#overlay"),sheetEl=$("#sheet");
function closeSheet(){overlay.classList.remove("open");sheetEl.innerHTML="";}
overlay.addEventListener("click",e=>{if(e.target===overlay)closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
function openSheet(nodes){sheetEl.innerHTML="";nodes.forEach(n=>sheetEl.append(n));overlay.classList.add("open");}
function opt(icon,label,fn,danger){
  return h("button",{class:"opt"+(danger?" danger":""),onclick:()=>{closeSheet();fn();}},h("span",{html:ico(icon,20)}),label);
}
function msgMenu(m){
  const c=activeChat();if(!c)return;
  const nodes=[];
  const mine=(m.reacts||{})[me.uid];
  const row=h("div",{class:"emojis"});
  ["👍","❤️","😂","😮","🙏"].forEach(e=>{
    row.append(h("button",{"aria-label":"Réagir "+e,"aria-pressed":String(mine===e),onclick:async()=>{
      closeSheet();
      try{await updateDoc(doc(db,"chats",c.id,"messages",m.id),{["reacts."+me.uid]:mine===e?deleteField():e});}catch(er){toast(errText(er));}
    }},e));
  });
  nodes.push(row);
  if(canPost(c))nodes.push(opt("reply","Répondre",()=>{replyTo=m;editing=null;renderComposer();}));
  if(m.text)nodes.push(opt("copy","Copier le texte",()=>{
    try{navigator.clipboard.writeText(m.text).then(()=>toast("Texte copié"),()=>toast("Copie impossible ici"));}catch(e){toast("Copie impossible ici");}
  }));
  if(m.from===me.uid){
    if(m.text)nodes.push(opt("edit","Modifier",()=>{editing=m;replyTo=null;renderComposer();}));
    nodes.push(opt("trash","Supprimer pour tous",async()=>{
      try{await deleteDoc(doc(db,"chats",c.id,"messages",m.id));}catch(e){toast(errText(e));}
    },true));
  }
  openSheet(nodes);
}
function chatMenu(){
  const c=activeChat();if(!c)return;
  const nodes=[h("h3",null,cname(c))];
  const fav=favs.includes(c.id);
  nodes.push(opt("star",fav?"Retirer des favoris":"Ajouter aux favoris",()=>{
    favs=fav?favs.filter(x=>x!==c.id):favs.concat([c.id]);lsSet("mld-fav",favs);renderHead();renderList();}));
  if(c.type==="perso")nodes.push(opt("x","Masquer la conversation",()=>{
    hidden=hidden.concat([c.id]);lsSet("mld-hidden",hidden);
    active=null;shownFor=null;setView("list");renderList();renderChatAll();
  },true));
  if((c.type==="groupe"||c.type==="canal")&&c.owner!==me.uid)nodes.push(opt("out",c.type==="canal"?"Se désabonner":"Quitter le groupe",async()=>{
    try{await updateDoc(doc(db,"chats",c.id),{members:arrayRemove(me.uid)});}catch(e){toast(errText(e));}
  },true));
  openSheet(nodes);
}
$("#btnMe").addEventListener("click",()=>{
  openSheet([
    h("h3",null,me.name),
    h("p",{class:"hint"},me.email+" — c’est avec cette adresse que tes amis peuvent te trouver."),
    opt("out","Se déconnecter",()=>signOut(auth),true)
  ]);
});

/* ---------- Nouvelle conversation ---------- */
async function findUserByEmail(e){
  const s=await getDocs(query(collection(db,"users"),where("emailLower","==",e.toLowerCase().trim()),limit(1)));
  return s.empty?null:{uid:s.docs[0].id,...s.docs[0].data()};
}
function newChatSheet(){
  let type="perso";
  const name=h("input",{type:"text",placeholder:"Nom",maxlength:"40","aria-label":"Nom"});
  const mail=h("input",{type:"email",placeholder:"ami@exemple.com","aria-label":"E-mail de ton ami",inputmode:"email",autocapitalize:"none"});
  const mails=h("input",{type:"text",placeholder:"ami1@mail.com, ami2@mail.com","aria-label":"E-mails des membres",autocapitalize:"none"});
  const fName=h("label",{class:"field"},h("span",null,"Nom"),name);
  const fMail=h("label",{class:"field"},h("span",null,"E-mail de ton ami"),mail);
  const fMails=h("label",{class:"field"},h("span",null,"E-mails des membres (séparés par des virgules)"),mails);
  const disc=h("div");
  const types=h("div",{class:"types"});
  const defs=[["perso","Discussion","avec un ami"],["groupe","Groupe","plusieurs amis"],["canal","Canal","tu publies"],["rejoindre","Rejoindre","un canal"]];
  const go=h("button",{class:"primary"},"Créer");
  function draw(){
    types.innerHTML="";
    defs.forEach(d=>types.append(h("button",{"aria-pressed":String(type===d[0]),onclick:()=>{type=d[0];draw();}},d[1],h("small",null,d[2]))));
    fName.style.display=(type==="groupe"||type==="canal")?"block":"none";
    fMail.style.display=type==="perso"?"block":"none";
    fMails.style.display=type==="groupe"?"block":"none";
    disc.style.display=type==="rejoindre"?"block":"none";
    go.style.display=type==="rejoindre"?"none":"block";
    if(type==="rejoindre")loadChannels(disc);
  }
  go.addEventListener("click",async()=>{
    go.disabled=true;
    try{
      if(type==="perso"){
        const em=mail.value.trim();
        if(!em){toast("Écris l’e-mail de ton ami.");return;}
        const u=await findUserByEmail(em);
        if(!u){toast("Aucun compte avec cet e-mail. Invite ton ami à s’inscrire d’abord.");return;}
        if(u.uid===me.uid){toast("C’est ta propre adresse.");return;}
        const id=[me.uid,u.uid].sort().join("_");
        await setDoc(doc(db,"chats",id),{type:"perso",owner:me.uid,members:[me.uid,u.uid],names:{[me.uid]:me.name,[u.uid]:u.name}},{merge:true});
        hidden=hidden.filter(x=>x!==id);lsSet("mld-hidden",hidden);
        closeSheet();openChat(id);
      }else if(type==="groupe"){
        const n=name.value.trim();
        if(!n){toast("Donne un nom au groupe.");return;}
        const list=mails.value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,20);
        const members=[me.uid],names={[me.uid]:me.name},missing=[];
        for(const em of list){
          const u=await findUserByEmail(em);
          if(u&&!members.includes(u.uid)){members.push(u.uid);names[u.uid]=u.name;}
          else if(!u)missing.push(em);
        }
        const ref=doc(collection(db,"chats"));
        await setDoc(ref,{type:"groupe",name:n,owner:me.uid,members,names});
        closeSheet();openChat(ref.id);
        if(missing.length)toast("Pas de compte pour : "+missing.join(", "));
      }else{
        const n=name.value.trim();
        if(!n){toast("Donne un nom au canal.");return;}
        const ref=doc(collection(db,"chats"));
        await setDoc(ref,{type:"canal",name:n,owner:me.uid,members:[me.uid],names:{[me.uid]:me.name}});
        closeSheet();openChat(ref.id);
      }
    }catch(e){toast(errText(e));}
    finally{go.disabled=false;}
  });
  openSheet([h("h3",null,"Nouvelle conversation"),types,fMail,fName,fMails,disc,go]);
  draw();
}
async function loadChannels(box){
  box.innerHTML="";box.append(h("p",{class:"hint"},"Chargement…"));
  try{
    const s=await getDocs(query(collection(db,"chats"),where("type","==","canal"),limit(30)));
    box.innerHTML="";
    const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!(c.members||[]).includes(me.uid));
    if(!rows.length){box.append(h("p",{class:"hint"},"Aucun autre canal pour l’instant. Crée le tien !"));return;}
    rows.forEach(c=>{
      box.append(h("div",{class:"chrow"},avatar(c,true),
        h("div",{class:"nm"},h("b",null,c.name||"Canal"),h("small",null,(c.members||[]).length+" abonné(s)")),
        h("button",{class:"mini",onclick:async()=>{
          try{await updateDoc(doc(db,"chats",c.id),{members:arrayUnion(me.uid)});closeSheet();openChat(c.id);}
          catch(e){toast(errText(e));}
        }},"S’abonner")));
    });
  }catch(e){box.innerHTML="";box.append(h("p",{class:"hint"},errText(e)));}
}
