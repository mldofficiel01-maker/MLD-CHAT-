<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6F0; --panel:#FFFFFF; --ink:#14232B; --muted:#5C6E77; --line:#DFE5DD;
  --mint:#159A6A; --mint-soft:#D8F1E5; --blue:#2F55F0; --blue-soft:#DDE5FF;
  --theirs:#FFFFFF; --danger:#D03A2A; --overlay:rgba(10,20,26,.45); --onaccent:#FFFFFF;
  --fs:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E171C; --panel:#16232A; --ink:#E8EFEA; --muted:#93A4AC; --line:#243741;
    --mint:#2CC48C; --mint-soft:#14513B; --blue:#7C93FF; --blue-soft:#233A8A;
    --theirs:#1C2D35; --danger:#FF7B6B; --overlay:rgba(0,0,0,.6); --onaccent:#0E171C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171C; --panel:#16232A; --ink:#E8EFEA; --muted:#93A4AC; --line:#243741;
  --mint:#2CC48C; --mint-soft:#14513B; --blue:#7C93FF; --blue-soft:#233A8A;
  --theirs:#1C2D35; --danger:#FF7B6B; --overlay:rgba(0,0,0,.6); --onaccent:#0E171C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}

/* Connexion */
#splash,#auth{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow-y:auto}
#splash{place-items:center}
#splash.show{display:grid}
#auth.show{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px 22px}
.card .logo{display:flex;justify-content:center;margin-bottom:6px}
.card h1{margin:0;text-align:center;font-size:32px;letter-spacing:-.02em}
.card .sub{margin:4px 0 18px;text-align:center;color:var(--muted);font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{padding:9px;border-radius:11px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.err{min-height:20px;margin:0 0 10px;color:var(--danger);font-size:14px;text-align:center}
.linkbtn{display:block;margin:14px auto 0;color:var(--blue);font-size:14px}

.app{height:100%;display:grid;grid-template-columns:1fr;overflow:hidden}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.app[data-view="list"] .chat-pane{display:none}
.app[data-view="chat"] .list-pane{display:none}
@media (min-width:820px){
  .app{grid-template-columns:360px 1fr}
  .app[data-view] .chat-pane,.app[data-view] .list-pane{display:flex}
  .list-pane{border-right:1px solid var(--line)}
  .back{display:none!important}
}

.top{display:flex;align-items:center;gap:6px;padding:14px 12px 6px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:26px;letter-spacing:-.02em;flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--line)}
.icon-btn.solid{background:var(--ink);color:var(--bg)}
.icon-btn.solid:hover{background:var(--ink);opacity:.88}
.me-btn{padding:0;overflow:hidden}
.search{margin:6px 16px 8px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;min-width:0;outline:none}
.chips{display:flex;gap:8px;padding:2px 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{flex:1;overflow-y:auto;padding:0 8px 16px}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:14px}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.item .mid{min-width:0}
.item .row1{display:flex;align-items:center;gap:6px}
.item .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500}
.tag.mint{background:var(--mint-soft);color:var(--mint)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.item .prev{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--muted)}
.badge{width:12px;height:12px;border-radius:50%;background:var(--mint)}
.empty-list{padding:40px 24px;text-align:center;color:var(--muted)}

.avatar{display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.avatar.round{border-radius:50%}
.avatar.square{border-radius:28%}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* Stories : bandeau */
.stories{display:flex;gap:12px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.stile{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);position:relative}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--blue))}
.ring.seen{background:var(--line)}
.ring.none{background:transparent;border:2px dashed var(--line)}
.ring .avatar{border:2px solid var(--bg)}
.stile .nm{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus{position:absolute;right:2px;top:40px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--onaccent);display:grid;place-items:center;border:2px solid var(--bg)}

/* Conversation */
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.chat-head .titles{flex:1;min-width:0;text-align:left}
.chat-head .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;font-size:var(--fs)}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:6px 0}
.bubble{max-width:80%;padding:8px 12px 6px;border-radius:16px;background:var(--theirs);border:1px solid var(--line);text-align:left;word-wrap:break-word;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--mine,var(--mint-soft));border-color:transparent;border-bottom-right-radius:5px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:5px}
.chat-pane[data-kind="canal"] .bubble.me{background:var(--blue-soft)}
.chat-pane[data-kind="canal"] .bubble.them{max-width:92%}
.bubble .who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:3px}
.bubble .txt{white-space:pre-wrap}
.bubble img.pic{display:block;max-width:100%;border-radius:10px;margin:2px 0 4px}
.bubble audio{display:block;max-width:100%;height:40px;margin:2px 0 4px}
.quote{border-left:3px solid var(--blue);padding:2px 8px;margin-bottom:5px;font-size:13px;color:var(--muted);background:rgba(127,127,127,.1);border-radius:4px}
.quote b{display:block;color:var(--blue);font-weight:700}
.meta{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}
.react{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.tick{font-weight:700;letter-spacing:-2px;font-size:12px}
.tick.read{color:var(--blue)}

.composer{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 6px 8px}
.bar .bq{flex:1;border-left:3px solid var(--blue);padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bq b{color:var(--blue)}
.row{display:flex;align-items:flex-end;gap:6px}
.row textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;line-height:1.3;max-height:120px;min-height:42px;outline:none}
.act{width:42px;height:42px;border-radius:50%;background:var(--acc,var(--mint));color:var(--onaccent);display:grid;place-items:center;flex:none}
.chat-pane[data-kind="canal"] .act{background:var(--blue)}
.act[hidden]{display:none}
.readonly{text-align:center;color:var(--muted);font-size:14px;padding:10px}
.recbar{display:flex;align-items:center;gap:10px;padding:0 6px}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.rectime{font-weight:500;flex:1}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recdot{animation:none}}

.placeholder{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;color:var(--muted);padding:24px}
.placeholder h2{margin:0;color:var(--ink);font-size:22px}
.placeholder p{margin:0;max-width:34ch}

/* Feuilles */
.overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:80}
.overlay.open{display:flex}
@media (min-width:820px){.overlay{align-items:center}}
.sheet{width:100%;max-width:440px;background:var(--panel);border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
@media (min-width:820px){.sheet{border-radius:22px}}
.sheet h3{margin:4px 6px 10px;font-size:18px}
.sheet h5{margin:12px 6px 4px;font-size:13px;color:var(--muted);font-weight:500}
.sheet .hint{margin:0 6px 12px;color:var(--muted);font-size:14px}
.emojis{display:flex;justify-content:space-around;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.emojis button{font-size:26px;width:46px;height:46px;border-radius:50%}
.emojis button:hover,.emojis button[aria-pressed="true"]{background:var(--line)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-radius:12px;text-align:left}
.opt:hover{background:var(--bg)}
.opt.danger{color:var(--danger)}
.field{display:block;margin:0 6px 12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.card input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.card .field{margin:0 0 12px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 6px 14px}
.types button{border:1px solid var(--line);border-radius:14px;padding:10px 6px;font-size:14px;text-align:center;background:var(--bg)}
.types button small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.types button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.primary{width:calc(100% - 12px);margin:0 6px;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px;font-weight:700}
.card .primary{width:100%;margin:0}
.primary[disabled]{opacity:.55}
.secondary{border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px;background:var(--bg)}
.chrow{display:flex;align-items:center;gap:12px;padding:8px 6px}
.chrow .nm{flex:1;min-width:0}
.chrow .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow .nm small{color:var(--muted)}
.chrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint)}
.mini{padding:7px 14px;border-radius:999px;background:var(--blue);color:var(--onaccent);font-size:14px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:88%;text-align:center;display:none}
.toast.show{display:block}

/* Créateur de story */
.spreview{margin:0 6px 12px;border-radius:16px;overflow:hidden;min-height:120px;display:grid;place-items:center;background:var(--bg)}
.spreview img{width:100%;max-height:300px;object-fit:contain;display:block}
.spreview textarea{width:100%;min-height:200px;border:0;background:transparent;color:#fff;font:inherit;font-size:24px;font-weight:700;text-align:center;padding:24px;resize:none;outline:none}
.spreview textarea::placeholder{color:rgba(255,255,255,.7)}
.bgs{display:flex;gap:10px;margin:0 6px 12px}
.bgs button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.bgs button[aria-pressed="true"]{border-color:var(--ink)}

/* Visionneuse de story */
.story{position:fixed;inset:0;background:#000;z-index:70;display:none;flex-direction:column;color:#fff}
.story.open{display:flex}
.sbars{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px}
.sbar{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:#fff}
.sbar.done i{width:100%}
.sbar.cur i{animation:sfill 5s linear forwards}
@keyframes sfill{to{width:100%}}
.story.paused .sbar.cur i{animation-play-state:paused}
.shead{display:flex;align-items:center;gap:10px;padding:6px 10px}
.shead .who{flex:1;min-width:0}
.shead .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .who small{opacity:.75}
.shead .icon-btn{color:#fff}
.shead .icon-btn:hover{background:rgba(255,255,255,.15)}
.sbody{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sbody img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.stext{padding:24px;font-size:28px;font-weight:700;text-align:center;width:100%;height:100%;display:grid;place-items:center;overflow-wrap:anywhere;white-space:pre-wrap}
.scap{position:absolute;left:0;right:0;bottom:0;padding:24px 18px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:center;pointer-events:none}
.sfoot{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;min-height:16px}
.sfoot button{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff}

/* Page Paramètres */
.page{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page.open{display:flex}
.phead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:19px}
.pbody{flex:1;overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));max-width:640px;width:100%;margin:0 auto}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 14px 6px;margin-bottom:16px}
.sec h4{margin:12px 0 4px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.sec h4 + .srow{border-top:0}
.srow .lbl{flex:1;min-width:0}
.srow .lbl small{display:block;color:var(--muted);font-size:13px}
.srow.danger{color:var(--danger)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{padding:6px 10px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--mint)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.swatch{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.pfp{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 4px}
.pfp .btns{display:flex;gap:8px}
.pfield{padding:8px 0 4px}
.pfield span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.pfield input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.savebtn{margin:8px 0 10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-weight:700}
</style>
<meta name="theme-color" content="#0E171C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MLD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<div id="splash" class="show" aria-label="Chargement"><div id="splashLogo"></div></div>

<div id="auth">
  <div class="card">
    <div class="logo" id="authLogo"></div>
    <h1>MLD</h1>
    <p class="sub">Discussions, groupes et canaux au même endroit.</p>
    <div class="tabs" role="group" aria-label="Mode">
      <button id="tabIn" aria-pressed="true">Connexion</button>
      <button id="tabUp" aria-pressed="false">Inscription</button>
    </div>
    <label class="field" id="nameField" style="display:none"><span>Pseudo</span><input id="aName" type="text" maxlength="30" autocomplete="nickname" placeholder="Ton prénom ou pseudo"></label>
    <label class="field"><span>Adresse e-mail</span><input id="aMail" type="email" autocomplete="email" inputmode="email" placeholder="toi@exemple.com"></label>
    <label class="field"><span>Mot de passe</span><input id="aPass" type="password" autocomplete="current-password" placeholder="6 caractères minimum"></label>
    <p class="err" id="aErr" role="alert"></p>
    <button class="primary" id="aGo">Se connecter</button>
    <button class="linkbtn" id="aReset">Mot de passe oublié ?</button>
  </div>
</div>

<div class="app" id="app" data-view="list" style="display:none">
  <section class="pane list-pane" aria-label="Conversations">
    <div class="top">
      <div class="brand" id="brand"></div>
      <button class="icon-btn solid" id="btnNew" aria-label="Nouvelle conversation"></button>
      <button class="icon-btn me-btn" id="btnMe" aria-label="Paramètres et profil"></button>
    </div>
    <div class="stories" id="stories" aria-label="Stories"></div>
    <label class="search"><span id="icoSearch"></span><input id="search" type="search" placeholder="Rechercher" aria-label="Rechercher une conversation"></label>
    <div class="chips" id="chips" role="group" aria-label="Filtres"></div>
    <div class="list" id="list"></div>
  </section>

  <section class="pane chat-pane" id="chatPane" aria-label="Conversation">
    <div class="placeholder" id="placeholder">
      <div id="bigLogo"></div>
      <h2>Tout au même endroit</h2>

function h(tag,attrs,...kids){
  const e=document.createElement(tag);

    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);

  }
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});

}

  return avEl({name:cname(c),photo:c.photo,shape:c.type==="canal"?"square":"round",size:size});
}
function readImage(file,opt){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const cv=document.createElement("canvas"),ctx=cv.getContext("2d");
        if(opt.square){
          cv.width=cv.height=opt.size;
          const m=Math.min(im.width,im.height);
          ctx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,opt.size,opt.size);
        }else{
          const k=Math.min(1,opt.max/Math.max(im.width,im.height));
          cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
          ctx.drawImage(im,0,0,cv.width,cv.height);
        }
        res(cv.toDataURL("image/jpeg",opt.q));
      };
      im.onerror=rej;im.src=r.result;
    };
    r.onerror=rej;r.readAsDataURL(file);
  });
}

let mode="in";

$("#tabIn").addEventListener("click",()=>setMode("in"));
$("#tabUp").addEventListener("click",()=>setMode("up"));
async function submitAuth(){
  const mail=$("#aMail").value.trim(),pass=$("#aPass").value,nm=$("#aName").value.trim();
  const err=$("#aErr");err.textContent="";err.style.color="var(--danger)";
  if(!mail||!pass){err.textContent="Remplis l’e-mail et le mot de passe.";return;}
  if(mode==="up"&&!nm){err.textContent="Choisis un pseudo.";return;}
  const btn=$("#aGo");btn.disabled=true;
  try{
    if(mode==="up"){
      pendingName=nm;
      const cred=await createUserWithEmailAndPassword(auth,mail,pass);
      await updateProfile(cred.user,{displayName:nm});
    }else{
      await signInWithEmailAndPassword(auth,mail,pass);
    }
  }catch(e){pendingName=null;err.textContent=errText(e);}
  btn.disabled=false;
}
$("#aGo").addEventListener("click",submitAuth);
$("#aPass").addEventListener("keydown",e=>{if(e.key==="Enter")submitAuth();});
$("#aReset").addEventListener("click",async()=>{
  const mail=$("#aMail").value.trim(),err=$("#aErr");
  if(!mail){err.style.color="var(--danger)";err.textContent="Écris ton e-mail ci-dessus, puis touche « Mot de passe oublié ».";return;}
  try{await sendPasswordResetEmail(auth,mail);err.style.color="var(--mint)";err.textContent="E-mail envoyé. Regarde aussi tes courriers indésirables.";}
  catch(e){err.style.color="var(--danger)";err.textContent=errText(e);}
});

function resetSession(){
  if(unsubChats){unsubChats();unsubChats=null;}
  if(unsubMsgs){unsubMsgs();unsubMsgs=null;}
  if(unsubStories){unsubStories();unsubStories=null;}
  Object.keys(userUnsubs).forEach(k=>{userUnsubs[k]();delete userUnsubs[k];delete usersCache[k];});
  chats=[];msgs=[];stories=[];active=null;shownFor=null;sv=null;
  initialChats=true;lastAtMap={};readsSig="";lastMarked={};cleanedStories=false;
  $("#settings").classList.remove("open");
  $("#story").classList.remove("open");
}
onAuthStateChanged(auth,async user=>{
  $("#splash").classList.remove("show");
  if(!user){
    me=null;resetSession();
    $("#app").style.display="none";
    $("#auth").classList.add("show");
    return;
  }
  const name=pendingName||user.displayName||(user.email||"Moi").split("@")[0];
  pendingName=null;
  me={uid:user.uid,name:name,email:user.email||""};
  $("#auth").classList.remove("show");
  $("#app").style.display="grid";
  watchUser(me.uid);
  try{
    await setDoc(doc(db,"users",me.uid),{email:me.email,emailLower:me.email.toLowerCase(),createdAt:Date.now()},{merge:true});
    const snap=await getDocs(query(collection(db,"users"),where("emailLower","==",me.email.toLowerCase()),limit(1)));
    const existing=snap.empty?null:snap.docs[0].data();
    if(!existing||!existing.name)await setDoc(doc(db,"users",me.uid),{name:me.name},{merge:true});
    else me.name=existing.name;
    await setDoc(doc(db,"chats","saved_"+me.uid),{type:"saved",name:"Messages enregistrés",owner:me.uid,members:[me.uid]},{merge:true});
  }catch(e){toast(errText(e));}
  startChats();startStories();paintMeBtn();
});

function startChats(){
  if(unsubChats)unsubChats();
  unsubChats=onSnapshot(query(collection(db,"chats"),where("members","array-contains",me.uid)),snap=>{
    snap.docChanges().forEach(ch=>{
      const d=ch.doc.data(),id=ch.doc.id,prev=lastAtMap[id]||0;
      if(!initialChats&&(ch.type==="added"||ch.type==="modified")&&d.lastFrom&&d.lastFrom!==me.uid&&(d.lastAt||0)>prev&&!ch.doc.metadata.hasPendingWrites){
        if(!(id===active&&view==="chat"&&document.visibilityState==="visible"))notifyIncoming();
      }
      lastAtMap[id]=d.lastAt||0;
    });
    initialChats=false;
    chats=snap.docs.map(d=>({id:d.id,...d.data()}));
    chats.forEach(c=>(c.members||[]).forEach(watchUser));
    if(active&&view==="chat")markRead(active);
    renderList();renderStories();
    const c=activeChat();
    if(active&&!c){active=null;shownFor=null;setView("list");renderChatAll();}
    else if(c){
      if(shownFor!==active){shownFor=active;renderChatAll();}
      else{
        renderHead();
        const sig=JSON.stringify(c.reads||{});
        if(sig!==readsSig){readsSig=sig;renderMsgs();}
      }
      maybeMarkRead();
    }
  },e=>toast(errText(e)));
}

/* ---------- Sons ---------- */
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
document.addEventListener("pointerdown",unlockAudio,{once:true});
function notifyIncoming(){
  if(settings.vibrate&&navigator.vibrate){try{navigator.vibrate(60);}catch(e){}}
  if(!settings.sound||!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type="sine";o.frequency.value=880;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.3);
  }catch(e){}
}

const FILTERS=[["tout","Tout"],["discussions","Discussions"],["canaux","Canaux"],["favoris","Favoris"]];
function renderChips(){
  const box=$("#chips");box.innerHTML="";
  FILTERS.forEach(f=>box.append(h("button",{class:"chip","aria-pressed":String(filter===f[0]),onclick:()=>{filter=f[0];renderChips();renderList();}},f[1])));
}
function matches(c){
  if(hidden.includes(c.id))return false;
  if(filter==="discussions"&&!(c.type==="perso"||c.type==="groupe"||c.type==="saved"))return false;
  if(filter==="canaux"&&c.type!=="canal")return false;
  if(filter==="favoris"&&!favs.includes(c.id))return false;
  if(queryText&&cname(c).toLowerCase().indexOf(queryText.toLowerCase())<0)return false;
  return true;
}
function isUnread(c){
  return !!c.lastAt&&c.lastFrom!==me.uid&&c.lastAt>(reads[c.id]||0)&&!(active===c.id&&view==="chat");
}
function renderList(){
  if(!me)return;
  const box=$("#list");box.innerHTML="";
  const arr=chats.filter(matches).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  if(!arr.length){box.append(h("div",{class:"empty-list"},"Aucune conversation ici. Touche + pour en commencer une."));return;}
  arr.forEach(c=>{
    const tag=tagFor(c);
    let pv=c.lastText||"Aucun message";
    if(c.lastFrom===me.uid&&c.type!=="saved")pv="Toi : "+pv;
    else if(c.type==="groupe"&&c.lastFrom)pv=userName(c.lastFrom,c.lastFromName)+" : "+pv;
    box.append(h("button",{class:"item","aria-current":String(active===c.id),onclick:()=>openChat(c.id)},
      chatAvatar(c,48),
      h("div",{class:"mid"},
        h("div",{class:"row1"},h("span",{class:"name"},cname(c)),tag?h("span",{class:"tag "+tag[1]},tag[0]):null),
        h("div",{class:"prev"},pv)),
      h("div",{class:"side"},h("span",null,c.lastAt?fmtTime(c.lastAt):""),isUnread(c)?h("span",{class:"badge","aria-label":"Nouveau message"}):null)
    ));
  });
}

  active=id;replyTo=null;editing=null;

  markRead(id);setView("chat");
  if(unsubMsgs)unsubMsgs();
  msgs=[];firstLoad=true;

function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("L’enregistrement vocal n’est pas disponible ici.");return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const mr=new MediaRecorder(stream),chunks=[],start=Date.now();
    rec={mr,stream,start,cancel:false,timer:null};
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=()=>{
      const r0=rec;clearInterval(r0.timer);
      stream.getTracks().forEach(t=>t.stop());
      rec=null;
      if(r0.cancel){renderComposer();return;}
      const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
      const fr=new FileReader();
      fr.onload=()=>{
        renderComposer();
        if(fr.result.length>850000){toast("Message vocal trop long (30 secondes maximum).");return;}
        sendMsg({audio:fr.result});
      };
      fr.readAsDataURL(blob);
    };
    rec.timer=setInterval(()=>{
      const s=Math.floor((Date.now()-rec.start)/1000);
      const el=$("#rectime");if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
      if(s>=30)rec.mr.stop();
    },250);
    mr.start();renderComposer();
  }).catch(()=>toast("Micro refusé ou indisponible. Autorise-le dans ton navigateur."));
}
function cancelRec(){if(rec){rec.cancel=true;try{rec.mr.stop();}catch(e){}}}

function newChatSheet(){
  let type="perso";
  const name=h("input",{type:"text",placeholder:"Nom",maxlength:"40","aria-label":"Nom"});

  const fMails=h("label",{class:"field"},h("span",null,"E-mails des membres (séparés par des virgules)"),mails);
  const disc=h("div");
  const types=h("div",{class:"types"});
  const defs=[["perso","Discussion","avec un ami"],["groupe","Groupe","plusieurs amis"],["canal","Canal","tu publies"],["rejoindre","Rejoindre","un canal"]];
  const go=h("button",{class:"primary"},"Créer");
  function draw(){
    types.innerHTML="";

      if(type==="perso"){

        const u=await findUserByEmail(em);

        if(u.uid===me.uid){toast("C’est ta propre adresse.");return;}

          else if(!u)missing.push(em);

  const n=Date.now(),by={};

  Object.keys(by).forEach(u=>by[u].sort((a,b)=>a.t-b.t));
  const others=Object.keys(by).filter(u=>u!==me.uid).map(u=>({uid:u,stories:by[u],unseen:by[u].some(s=>!seenSt[s.id])}));
  others.sort((a,b)=>(Number(b.unseen)-Number(a.unseen))||(b.stories[b.stories.length-1].t-a.stories[a.stories.length-1].t));
  return {mine:by[me.uid]||[],others:others};

  const cap=h("input",{type:"text",maxlength:"120",placeholder:"Ajouter une légende (facultatif)","aria-label":"Légende"});
  const txt=h("textarea",{maxlength:"200",placeholder:"Écris ta story…","aria-label":"Texte de la story"});
  const wrap=h("div");
  function draw(){
    wrap.innerHTML="";
    if(!kind){
      wrap.append(h("div",{class:"types"},
        h("button",{onclick:()=>{$("#storyFile").click();}},"📷 Photo",h("small",null,"depuis ta galerie ou ton appareil")),
        h("button",{onclick:()=>{kind="text";draw();}},"Aa Texte",h("small",null,"sur fond de couleur"))));
      return;
    }
    if(kind==="image"){
      wrap.append(h("div",{class:"spreview"},h("img",{src:img,alt:"Aperçu de la story"})));
      wrap.append(h("label",{class:"field"},cap));
    }else{
      const p=h("div",{class:"spreview"},txt);p.style.background=bg;
      wrap.append(p);
      const row=h("div",{class:"bgs"});
      STORY_BGS.forEach(c=>{const b=h("button",{"aria-label":"Couleur "+c,"aria-pressed":String(bg===c),onclick:()=>{bg=c;p.style.background=c;[...row.children].forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");}});b.style.background=c;row.append(b);});
      wrap.append(row);
    }
    wrap.append(h("h5",null,"Qui peut la voir ? (valable 24 h)"));
    const seg=h("div",{class:"types"},
      h("button",{"aria-pressed":String(audMode==="all"),onclick:()=>{audMode="all";draw();}},"Tous mes contacts",h("small",null,contacts.length+" personne"+(contacts.length>1?"s":""))),
      h("button",{"aria-pressed":String(audMode==="choose"),onclick:()=>{audMode="choose";draw();}},"Je choisis",h("small",null,"cocher les contacts")));
    wrap.append(seg);
    if(audMode==="choose"){
      contacts.forEach(c=>{
        const cb=h("input",{type:"checkbox","aria-label":c.name});cb.checked=!!chosen[c.uid];
        cb.addEventListener("change",()=>{chosen[c.uid]=cb.checked;});
        wrap.append(h("label",{class:"chrow"},userAvatar(c.uid,36,c.name),h("div",{class:"nm"},h("b",null,c.name)),cb));
      });
    }
    if(!contacts.length)wrap.append(h("p",{class:"hint"},"Tu n’as pas encore de discussion avec un ami : seul toi verras cette story. Commence une discussion avec le bouton +."));
    wrap.append(h("button",{class:"primary",onclick:publish},"Publier"));
  }
  async function publish(ev){
    const btn=ev.currentTarget;
    if(kind==="text"&&!txt.value.trim()){toast("Écris quelque chose.");return;}
    const now=Date.now();
    const aud=[me.uid].concat(contacts.filter(c=>audMode==="all"||chosen[c.uid]).map(c=>c.uid));
    const data={owner:me.uid,ownerName:me.name,t:now,exp:now+864e5,type:kind,audience:aud,viewers:{}};
    if(kind==="image"){data.img=img;const c=cap.value.trim();if(c)data.caption=c;}
    else{data.text=txt.value.trim();data.bg=bg;}
    btn.disabled=true;
    try{await addDoc(collection(db,"stories"),data);closeSheet();toast("Story publiée.");}
    catch(e){toast(errText(e)+" (les règles Firestore doivent inclure les stories)");btn.disabled=false;}
  }
  storyPick=async f=>{
    try{
      const d=await readImage(f,{max:720,q:.6});
      if(d.length>850000){toast("Photo trop lourde.");return;}
      img=d;kind="image";draw();
    }catch(e){toast("Impossible de lire cette image.");}
  };
  openSheet([h("h3",null,"Nouvelle story"),wrap]);
  draw();
}
let storyPick=null;
$("#storyFile").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(f&&storyPick)storyPick(f);
});

function openStories(uid){
  const g=storyGroups();
  const groups=[];
  if(g.mine.length)groups.push({uid:me.uid,stories:g.mine});
  g.others.forEach(o=>groups.push({uid:o.uid,stories:o.stories}));
  const gi=groups.findIndex(x=>x.uid===uid);
  if(gi<0)return;
  let si=0;
  if(uid!==me.uid){const k=groups[gi].stories.findIndex(s=>!seenSt[s.id]);si=k<0?0:k;}
  sv={groups:groups,gi:gi,si:si,down:0};
  showStory();
}
function closeStories(){
  sv=null;
  $("#story").classList.remove("open","paused");
  $("#sbars").innerHTML="";$("#sbodyStory").innerHTML="";$("#sfoot").innerHTML="";$("#shead").innerHTML="";
  renderStories();
}
function nextStory(){
  if(!sv)return;
  const g=sv.groups[sv.gi];
  if(sv.si<g.stories.length-1){sv.si++;showStory();return;}
  if(sv.gi<sv.groups.length-1){sv.gi++;sv.si=0;showStory();return;}
  closeStories();
}
function prevStory(){
  if(!sv)return;
  if(sv.si>0){sv.si--;showStory();return;}
  if(sv.gi>0){sv.gi--;sv.si=0;showStory();return;}
  showStory();
}
function showStory(){
  if(!sv)return;
  const g=sv.groups[sv.gi],s=g.stories[sv.si];
  if(!s){closeStories();return;}
  const box=$("#story");box.classList.add("open");box.classList.remove("paused");
  const own=s.owner===me.uid;
  const bars=$("#sbars");bars.innerHTML="";
  g.stories.forEach((_,i)=>{
    const bar=h("div",{class:"sbar"+(i<sv.si?" done":i===sv.si?" cur":"")},h("i"));
    if(i===sv.si)bar.firstChild.addEventListener("animationend",nextStory);
    bars.append(bar);
  });
  const head=$("#shead");head.innerHTML="";
  head.append(
    userAvatar(s.owner,38,s.ownerName),
    h("div",{class:"who"},h("b",null,own?"Ma story":userName(s.owner,s.ownerName)),h("small",null,ago(s.t))),
    own?h("button",{class:"icon-btn","aria-label":"Supprimer cette story",html:ico("trash",20),onclick:async()=>{
      box.classList.add("paused");
      try{await deleteDoc(doc(db,"stories",s.id));}catch(e){toast(errText(e));}
      g.stories.splice(sv.si,1);
      if(!g.stories.length){sv.groups.splice(sv.gi,1);sv.si=0;if(sv.gi>=sv.groups.length){closeStories();return;}}
      else if(sv.si>=g.stories.length)sv.si=g.stories.length-1;
      showStory();
    }}):null,
    h("button",{class:"icon-btn","aria-label":"Fermer",html:ico("x",22),onclick:closeStories})
  );
  const body=$("#sbodyStory");body.innerHTML="";
  if(s.type==="image"){
    body.append(h("img",{src:s.img,alt:"Story"}));
    if(s.caption)body.append(h("div",{class:"scap"},s.caption));
  }else{
    const t=h("div",{class:"stext"},s.text||"");t.style.background=s.bg||STORY_BGS[0];
    body.append(t);
  }
  body.onpointerdown=()=>{sv.down=Date.now();box.classList.add("paused");};
  body.onpointercancel=()=>{box.classList.remove("paused");};
  body.onpointerup=e=>{
    box.classList.remove("paused");
    if(Date.now()-sv.down<250){(e.clientX<window.innerWidth*.3)?prevStory():nextStory();}
  };
  const foot=$("#sfoot");foot.innerHTML="";
  if(own){
    const cur=stories.find(x=>x.id===s.id)||s;
    const n=Object.keys(cur.viewers||{}).length;
    foot.append(h("button",{onclick:()=>{box.classList.add("paused");storyViewers(s.id);}},"👁 "+n+" vue"+(n>1?"s":"")));
  }
  seenSt[s.id]=1;lsSet("mld-seenst",seenSt);
  if(!own&&settings.readReceipts&&!(s.viewers&&s.viewers[me.uid])){
    updateDoc(doc(db,"stories",s.id),{["viewers."+me.uid]:{t:Date.now(),name:me.name}}).catch(()=>{});
  }
}
function storyViewers(id){
  const s=stories.find(x=>x.id===id);
  const list=Object.entries((s&&s.viewers)||{}).sort((a,b)=>b[1].t-a[1].t);
  const nodes=[h("h3",null,"Vues de ta story")];
  if(!settings.readReceipts)nodes.push(h("p",{class:"hint"},"Tu as désactivé les confirmations de lecture : tu ne vois pas qui regarde tes stories."));
  else if(!list.length)nodes.push(h("p",{class:"hint"},"Personne n’a encore vu cette story."));
  list.forEach(([uid,v])=>nodes.push(personRow(uid,v.name,ago(v.t))));
  openSheet(nodes);
}

/* ---------- Paramètres ---------- */
let settingsHolder=null,installEv=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;});
window.addEventListener("appinstalled",()=>{installEv=null;toast("MLD est installée sur ton téléphone.");});
function paintSettingsAvatar(){
  if(!settingsHolder||!$("#settings").classList.contains("open"))return;
  settingsHolder.innerHTML="";
  settingsHolder.append(avEl({name:userName(me.uid,me.name),photo:userPhoto(me.uid),size:96}));
}
function seg(opts,cur,onPick){
  const box=h("div",{class:"seg",role:"group"});
  function draw(v){
    box.innerHTML="";
    opts.forEach(o=>box.append(h("button",{"aria-pressed":String(v===o[0]),onclick:()=>{onPick(o[0]);draw(o[0]);}},o[1])));
  }
  draw(cur);return box;
}
function sw(label,cur,onPick){
  const b=h("button",{class:"sw",role:"switch","aria-label":label,"aria-checked":String(!!cur)});
  b.addEventListener("click",()=>{cur=!cur;b.setAttribute("aria-checked",String(cur));onPick(cur);});
  return b;
}
function row(label,sub,ctl){return h("div",{class:"srow"},h("div",{class:"lbl"},label,sub?h("small",null,sub):null),ctl);}
function tapRow(label,sub,fn,danger){
  return h("button",{class:"srow"+(danger?" danger":""),onclick:fn},h("div",{class:"lbl"},label,sub?h("small",null,sub):null));
}
function sec(title,...rows){return h("div",{class:"sec"},h("h4",null,title),rows);}
function openSettings(){
  const body=$("#sbody");body.innerHTML="";
  const prof=userName(me.uid,me.name);
  const u=usersCache[me.uid]||{};
  const holder=h("div");settingsHolder=holder;
  const nameIn=h("input",{type:"text",maxlength:"30","aria-label":"Pseudo"});nameIn.value=prof;
  const bioIn=h("input",{type:"text",maxlength:"80",placeholder:"Une phrase sur toi","aria-label":"À propos"});bioIn.value=u.bio||"";
  const save=h("button",{class:"savebtn",onclick:async()=>{
    const n=nameIn.value.trim();
    if(!n){toast("Le pseudo ne peut pas être vide.");return;}
    try{
      await updateDoc(doc(db,"users",me.uid),{name:n,bio:bioIn.value.trim().slice(0,80)});
      try{await updateProfile(auth.currentUser,{displayName:n});}catch(e){}
      me.name=n;toast("Profil enregistré.");
    }catch(e){toast(errText(e));}
  }},"Enregistrer le profil");
  body.append(sec("Profil",
    h("div",{class:"pfp"},holder,h("div",{class:"btns"},
      h("button",{class:"secondary",onclick:()=>$("#avatarFile").click()},"Changer la photo"),
      h("button",{class:"secondary",onclick:async()=>{try{await updateDoc(doc(db,"users",me.uid),{photo:deleteField()});toast("Photo retirée.");}catch(e){toast(errText(e));}}},"Retirer"))),
    h("label",{class:"pfield"},h("span",null,"Pseudo"),nameIn),
    h("label",{class:"pfield"},h("span",null,"À propos"),bioIn),
    save));
  paintSettingsAvatar();

  const sw1=h("div",{class:"swatches"});
  ACCENTS.forEach(c=>{
    const b=h("button",{class:"swatch","aria-label":c?"Couleur "+c:"Couleur par défaut","aria-pressed":String(settings.accent===c),onclick:()=>{
      settings.accent=c;saveSettings();[...sw1.children].forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");}});
    b.style.background=c||"linear-gradient(135deg,var(--mint),var(--blue))";
    sw1.append(b);
  });
  body.append(sec("Apparence",
    row("Thème",null,seg([["auto","Auto"],["light","Clair"],["dark","Sombre"]],settings.theme,v=>{settings.theme=v;saveSettings();})),
    row("Taille du texte","Dans les conversations",seg([["sm","A-"],["md","A"],["lg","A+"]],settings.fs,v=>{settings.fs=v;saveSettings();})),
    row("Couleur de mes bulles",null,sw1)));

  body.append(sec("Confidentialité",
    row("Confirmations de lecture","Affiche « lu » (✓✓) sur tes messages et montre quand tu lis. Si tu les désactives, tu ne vois pas non plus celles des autres.",
      sw("Confirmations de lecture",settings.readReceipts,v=>{settings.readReceipts=v;saveSettings();if(v)maybeMarkRead();})),
    row("Audience de mes stories","Par défaut",seg([["all","Contacts"],["choose","Je choisis"]],settings.storyAudience,v=>{settings.storyAudience=v;saveSettings();})),
    tapRow("Afficher à nouveau les discussions masquées",hidden.length?hidden.length+" masquée"+(hidden.length>1?"s":""):"Aucune pour l’instant",()=>{hidden=[];lsSet("mld-hidden",hidden);renderList();toast("Discussions réaffichées.");})));

  body.append(sec("Notifications",
    row("Son des nouveaux messages","Quand MLD est ouverte",sw("Son des messages",settings.sound,v=>{settings.sound=v;saveSettings();if(v){unlockAudio();notifyIncoming();}})),
    row("Vibration",null,sw("Vibration",settings.vibrate,v=>{settings.vibrate=v;saveSettings();}))));

  const account=[h("div",{class:"srow"},h("div",{class:"lbl"},"Adresse e-mail",h("small",null,me.email)))];
  const standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone;
  if(!standalone){
    if(installEv)account.push(tapRow("Installer MLD sur mon téléphone",null,()=>{installEv.prompt();installEv=null;}));
    else if(/iphone|ipad|ipod/i.test(navigator.userAgent))account.push(h("div",{class:"srow"},h("div",{class:"lbl"},"Installer MLD","Touche Partager dans Safari, puis « Sur l’écran d’accueil ».")));
    else account.push(h("div",{class:"srow"},h("div",{class:"lbl"},"Installer MLD","Menu ⋮ du navigateur, puis « Installer l’application ».")));
  }
  account.push(tapRow("Changer le mot de passe","Un e-mail te sera envoyé",async()=>{
    try{await sendPasswordResetEmail(auth,me.email);toast("E-mail envoyé à "+me.email);}catch(e){toast(errText(e));}
  }));
  account.push(tapRow("Se déconnecter",null,()=>{closeSettings();signOut(auth);}));
  account.push(tapRow("Supprimer mon compte","Action définitive",deleteAccountSheet,true));
  body.append(sec("Compte",...account));
  body.append(h("p",{class:"hint",style:"text-align:center;color:var(--muted);font-size:13px"},"MLD · version 2. Les réglages d’apparence, de son et de confidentialité sont enregistrés sur cet appareil."));
  $("#settings").classList.add("open");
  paintSettingsAvatar();
}
function closeSettings(){$("#settings").classList.remove("open");settingsHolder=null;}
function deleteAccountSheet(){
  const inp=h("input",{type:"text",placeholder:"SUPPRIMER","aria-label":"Confirmation",autocapitalize:"characters"});
  openSheet([
    h("h3",null,"Supprimer mon compte"),
    h("p",{class:"hint"},"Ton profil et tes stories seront supprimés. Tes anciens messages restent visibles dans les conversations. Écris SUPPRIMER pour confirmer."),
    h("label",{class:"field"},inp),
    h("button",{class:"primary",style:"background:var(--danger);color:#fff",onclick:async()=>{
      if(inp.value.trim().toUpperCase()!=="SUPPRIMER"){toast("Écris SUPPRIMER pour confirmer.");return;}
      try{
        for(const s of stories.filter(x=>x.owner===me.uid))await deleteDoc(doc(db,"stories",s.id)).catch(()=>{});
        await deleteDoc(doc(db,"users",me.uid));
        await deleteUser(auth.currentUser);
        closeSheet();closeSettings();
      }catch(e){toast(errText(e));}
    }},"Supprimer définitivement")
  ]);
}
$("#avatarFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  try{
    const d=await readImage(f,{square:true,size:192,q:.75});
    await updateDoc(doc(db,"users",me.uid),{photo:d});
    toast("Photo de profil mise à jour.");
  }catch(er){toast(errText(er));}
});
